---

name: CI & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

# ─── Stage 1: pre-commit ─────────────────────────────────────────────────────
# JSON/YAML parsing+linting, Ruff, Mypy, Pytest.
# ─── Stage 2: validate (hacs, hassfest) ──────────────────────────────────────
# HA-specific validators. Both run in parallel after pre-commit.
# ─── Stage 3: release ────────────────────────────────────────────────────────
# Semantic release. Only runs on push to main after all validators pass.

jobs:
  # ── Stage 1 ─────────────────────────────────────────────────────────────────
  pre-commit:
    name: "Stage 1 · JSON+YAML / Ruff / Mypy / Pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Validate JSON files
        run: |
          find . -name "*.json" \
            -not -path "./.venv/*" \
            -not -path "./node_modules/*" \
            | sort | while read -r f; do
              python -m json.tool "$f" > /dev/null && echo "✓ $f" || exit 1
            done

      - name: Lint YAML files
        run: |
          uvx yamllint --config-file .yamllint.yml \
            custom_components/lametric_hass_local/services.yaml \
            .github/

      - name: Lint & Format Check (Ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type Check (Mypy)
        run: uv run mypy .

      - name: Run Tests (Pytest)
        run: uv run pytest --cov=custom_components/lametric_hass_local --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Stage 2 ─────────────────────────────────────────────────────────────────
  hacs:
    name: "Stage 2 · HACS"
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: integration

  hassfest:
    name: "Stage 2 · Hassfest"
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate with hassfest
        uses: "home-assistant/actions/hassfest@master"

  # ── Stage 3 ─────────────────────────────────────────────────────────────────
  release:
    name: "Stage 3 · Semantic Release"
    needs: [hacs, hassfest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install python-semantic-release
        run: uv tool install python-semantic-release

      - name: Determine next version
        id: version
        run: |
          NEXT_VER=$(semantic-release print-version --next || true)
          echo "version=${NEXT_VER}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes & changelog
        if: steps.version.outputs.version != ''
        id: notes
        run: |
          RELEASE_NOTES=$(semantic-release changelog --post-to-release-tag "v${{ steps.version.outputs.version }}")

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in files
        if: steps.version.outputs.version != ''
        run: |
          NEW_VER="${{ steps.version.outputs.version }}"

          sed -i "s/^version = \".*\"/version = \"${NEW_VER}\"/" pyproject.toml

          python3 -c "
          import json
          path = 'custom_components/lametric_hass_local/manifest.json'
          with open(path, 'r') as f:
              data = json.load(f)
          data['version'] = '${NEW_VER}'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

      - name: Create release ZIP
        if: steps.version.outputs.version != ''
        run: |
          python -m zipfile -c lametric-hass-local.zip \
            custom_components/lametric_hass_local/ \
            README.md \
            LICENSE

      - name: Create GitHub Release
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ steps.notes.outputs.changelog }}
          files: lametric-hass-local.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

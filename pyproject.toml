[project]
name = "lametric-hass-local"
version = "0.0.0"
description = ""
authors = [
    { name = "Caspar Weber" }
]
dependencies = [
    "homeassistant>=2026.8.2",
    "lametric-py>=1.3.15",
]
requires-python = ">=3.14.2"
readme = "README.md"
license = { text = "MIT" }

# ------------------------------------------------------------------------------
# UV & DEV DEPENDENCIES
# ------------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "mypy>=1.20.1",
    "ruff>=0.15.10",
    "pre-commit>=4.5.1",
    "python-semantic-release>=10.5.3",
    "commitizen>=4.13.10",
    "homeassistant-stubs>=2026.4.4",
    "pytest-homeassistant-custom-component>=0.13.332",
    "homeassistant>=2026.7.3",
]

# ------------------------------------------------------------------------------
# RUFF (Linter & Formatter)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# E: Pycodestyle, F: Pyflakes, I: Isort (Imports), N: Naming, UP: Upgrade, B: Bugbear
select = ["E", "F", "I", "N", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------------------
# MYPY (Type Checking)
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disallow_any_generics = false

# ------------------------------------------------------------------------------
# PYTEST (Testing)
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components/lametric_hass_local --cov-report=term-missing"
asyncio_mode = "auto"

# ------------------------------------------------------------------------------
# SEMANTIC RELEASE (Auto-Versioning)
# ------------------------------------------------------------------------------
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
version_variables = [
    "custom_components/lametric_hass_local/manifest.json:version"
]
major_on_zero = false
# The PSR action's Docker image has no `zip` binary, so use Python's stdlib
# instead. HACS zip_release expects the integration folder's contents at the
# zip root, which make_archive(root_dir=...) produces directly.
build_command = """
mkdir -p dist
find custom_components/lametric_hass_local -name "__pycache__" -type d -exec rm -rf {} +
python3 -c "import shutil; shutil.make_archive('dist/lametric-hass-local', 'zip', 'custom_components/lametric_hass_local')"
"""

[tool.semantic_release.changelog]
exclude_commit_patterns = ["chore", "ci"]

[tool.semantic_release.branches.main]
match = "main"
